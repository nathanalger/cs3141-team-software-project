name: Frontend tests

on:
   pull_request:
   push:
      branches:
         - main

permissions:
   contents: read

jobs:
   test:
      name: Run frontend tests
      runs-on: ubuntu-latest
      steps:
         - name: Check out repository
           uses: actions/checkout@v4

         - name: Set up Deno
           uses: denoland/setup-deno@v2
           with:
              deno-version: v2.9.7

         - name: Install dependencies
           run: deno install --frozen

         - name: Run frontend tests
           run: deno task test
